version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    staticcheck:
      checks:
        - all
        # Negated conjunctions intentionally mirror the documented safety rules.
        - -QF1001
        # Defaults of golangci-lint's staticcheck that stay disabled.
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
      - linters:
          - goconst
          - gocyclo
          - prealloc
        path: _test\.go
      # These packages repeat many SONiC table, field and state names as
      # literals. goconst stays enabled for all other packages.
      - linters:
          - goconst
        path: ^(internal/agent/agent_client/client|internal/agent/artifactstate|internal/agent/host|internal/agent/sonic|internal/artifact|internal/controller)/
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$

            type: object
            x-kubernetes-validations:
            - message: localAddress must match peer address family
              rule: ip(self.address).family() == ip(self.localAddress).family()
            - message: Transit requires explicit RT sets and no local mapping references
              rule: self.role != 'Transit' || ((!has(self.mappingRefs) || size(self.mappingRefs)

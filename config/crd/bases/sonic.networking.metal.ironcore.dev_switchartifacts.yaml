---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: switchartifacts.sonic.networking.metal.ironcore.dev
spec:
  group: sonic.networking.metal.ironcore.dev
  names:
    kind: SwitchArtifact
    listKind: SwitchArtifactList
    plural: switchartifacts
    singular: switchartifact
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              activation:
                default: AgentRestart
                enum:
                - AgentRestart
                - PlatformNextBoot
                type: string
              agent:
                description: |-
                  ArtifactAgentOptions is rendered into a fixed unit; unit text and arbitrary
                  flags cannot be supplied as artifact content.
                properties:
                  artifacts:
                    type: boolean
                  bindAddress:
                    type: string
                  breakout:
                    type: boolean
                  frrMigration:
                    type: boolean
                  hostConfig:
                    type: boolean
                  hostGuard:
                    type: boolean
                  network:
                    type: boolean
                  port:
                    maximum: 65535
                    minimum: 1
                    type: integer
                  readOnly:
                    type: boolean
                  redundancy:
                    type: boolean
                  trafficPolicy:
                    type: boolean
                  vlanAuthority:
                    type: boolean
                required:
                - bindAddress
                - port
                type: object
              baseline:
                description: Baseline must match the independently installed supervisor
                  policy.
                minLength: 1
                type: string
              bootstrap:
                description: |-
                  ArtifactBootstrapSpec declares the immutable recovery baseline. The main
                  agent independently enforces it so recovery never depends on replacing itself.
                  Changes are governed by SwitchArtifactSpec.BootstrapMigrationFrom.
                properties:
                  hostRecovery:
                    description: |-
                      ArtifactHostRecoverySpec selects the finite FleetHostV1 suite. No executable
                      arguments, destination paths or generated unit text are accepted.
                    properties:
                      binaryChunks:
                        items:
                          description: |-
                            ArtifactContentRef pins an immutable object, including its UID, so deleting
                            and recreating an identically named source cannot replace approved bytes.
                          properties:
                            key:
                              minLength: 1
                              type: string
                            kind:
                              enum:
                              - ConfigMap
                              - Secret
                              type: string
                            name:
                              minLength: 1
                              type: string
                            uid:
                              minLength: 1
                              type: string
                          required:
                          - key
                          - kind
                          - name
                          - uid
                          type: object
                        maxItems: 256
                        minItems: 1
                        type: array
                      binarySHA256:
                        pattern: ^[a-f0-9]{64}$
                        type: string
                      configSHA256:
                        pattern: ^[a-f0-9]{64}$
                        type: string
                      journalLayout:
                        enum:
                        - FleetHostV1
                        type: string
                      macHooks:
                        items:
                          properties:
                            helperRef:
                              description: |-
                                ArtifactContentRef pins an immutable object, including its UID, so deleting
                                and recreating an identically named source cannot replace approved bytes.
                              properties:
                                key:
                                  minLength: 1
                                  type: string
                                kind:
                                  enum:
                                  - ConfigMap
                                  - Secret
                                  type: string
                                name:
                                  minLength: 1
                                  type: string
                                uid:
                                  minLength: 1
                                  type: string
                              required:
                              - key
                              - kind
                              - name
                              - uid
                              type: object
                            helperSHA256:
                              pattern: ^[a-f0-9]{64}$
                              type: string
                            kind:
                              description: |-
                                dc-management-only and set-management are deprecated legacy names for the
                                same helpers, accepted for hooks installed by earlier releases.
                              enum:
                              - management-mac-python
                              - management-mac-shell
                              - dc-management-only
                              - set-management
                              type: string
                            sourceHookRef:
                              description: |-
                                ArtifactContentRef pins an immutable object, including its UID, so deleting
                                and recreating an identically named source cannot replace approved bytes.
                              properties:
                                key:
                                  minLength: 1
                                  type: string
                                kind:
                                  enum:
                                  - ConfigMap
                                  - Secret
                                  type: string
                                name:
                                  minLength: 1
                                  type: string
                                uid:
                                  minLength: 1
                                  type: string
                              required:
                              - key
                              - kind
                              - name
                              - uid
                              type: object
                            sourceHookSHA256:
                              pattern: ^[a-f0-9]{64}$
                              type: string
                          required:
                          - helperRef
                          - helperSHA256
                          - kind
                          - sourceHookRef
                          - sourceHookSHA256
                          type: object
                          x-kubernetes-validations:
                          - message: MAC imports require immutable ConfigMap references
                            rule: self.sourceHookRef.kind == 'ConfigMap' && self.helperRef.kind
                              == 'ConfigMap'
                        maxItems: 2
                        type: array
                        x-kubernetes-list-map-keys:
                        - kind
                        x-kubernetes-list-type: map
                      profileRef:
                        description: |-
                          ArtifactContentRef pins an immutable object, including its UID, so deleting
                          and recreating an identically named source cannot replace approved bytes.
                        properties:
                          key:
                            minLength: 1
                            type: string
                          kind:
                            enum:
                            - ConfigMap
                            - Secret
                            type: string
                          name:
                            minLength: 1
                            type: string
                          uid:
                            minLength: 1
                            type: string
                        required:
                        - key
                        - kind
                        - name
                        - uid
                        type: object
                      profileSHA256:
                        pattern: ^[a-f0-9]{64}$
                        type: string
                      serviceSHA256:
                        pattern: ^[a-f0-9]{64}$
                        type: string
                      timerSHA256:
                        pattern: ^[a-f0-9]{64}$
                        type: string
                    required:
                    - binaryChunks
                    - binarySHA256
                    - configSHA256
                    - journalLayout
                    - profileRef
                    - profileSHA256
                    - serviceSHA256
                    - timerSHA256
                    type: object
                    x-kubernetes-validations:
                    - message: host inputs require immutable ConfigMap references
                      rule: self.binaryChunks.all(c, c.kind == 'ConfigMap') && self.profileRef.kind
                        == 'ConfigMap'
                  policyRef:
                    description: |-
                      ArtifactContentRef pins an immutable object, including its UID, so deleting
                      and recreating an identically named source cannot replace approved bytes.
                    properties:
                      key:
                        minLength: 1
                        type: string
                      kind:
                        enum:
                        - ConfigMap
                        - Secret
                        type: string
                      name:
                        minLength: 1
                        type: string
                      uid:
                        minLength: 1
                        type: string
                    required:
                    - key
                    - kind
                    - name
                    - uid
                    type: object
                  policySHA256:
                    pattern: ^[a-f0-9]{64}$
                    type: string
                  supervisorChunks:
                    items:
                      description: |-
                        ArtifactContentRef pins an immutable object, including its UID, so deleting
                        and recreating an identically named source cannot replace approved bytes.
                      properties:
                        key:
                          minLength: 1
                          type: string
                        kind:
                          enum:
                          - ConfigMap
                          - Secret
                          type: string
                        name:
                          minLength: 1
                          type: string
                        uid:
                          minLength: 1
                          type: string
                      required:
                      - key
                      - kind
                      - name
                      - uid
                      type: object
                    maxItems: 256
                    minItems: 1
                    type: array
                  supervisorSHA256:
                    pattern: ^[a-f0-9]{64}$
                    type: string
                  unitSHA256:
                    description: SHA of the fixed unit generated by the agent protocol
                      version.
                    pattern: ^[a-f0-9]{64}$
                    type: string
                required:
                - policyRef
                - policySHA256
                - supervisorChunks
                - supervisorSHA256
                - unitSHA256
                type: object
                x-kubernetes-validations:
                - message: bootstrap inputs require immutable ConfigMap references
                  rule: self.supervisorChunks.all(c, c.kind == 'ConfigMap') && self.policyRef.kind
                    == 'ConfigMap'
              bootstrapMigrationFrom:
                description: |-
                  BootstrapMigrationFrom explicitly approves replacing the bootstrap
                  supervisor and policy. It must equal the policySHA256 being replaced;
                  hostRecovery and unitSHA256 must stay unchanged. The switch still rejects
                  the new identity until its recorded bootstrap owner is migrated.
                pattern: ^[a-f0-9]{64}$
                type: string
              files:
                items:
                  properties:
                    chunks:
                      description: Chunks permit binaries larger than the Kubernetes
                        single-object limit.
                      items:
                        description: |-
                          ArtifactContentRef pins an immutable object, including its UID, so deleting
                          and recreating an identically named source cannot replace approved bytes.
                        properties:
                          key:
                            minLength: 1
                            type: string
                          kind:
                            enum:
                            - ConfigMap
                            - Secret
                            type: string
                          name:
                            minLength: 1
                            type: string
                          uid:
                            minLength: 1
                            type: string
                        required:
                        - key
                        - kind
                        - name
                        - uid
                        type: object
                      maxItems: 256
                      minItems: 1
                      type: array
                    sha256:
                      description: SHA256 is over the concatenation of the referenced
                        chunks in order.
                      pattern: ^[a-f0-9]{64}$
                      type: string
                    slot:
                      enum:
                      - AgentBinary
                      - AgentCertificate
                      - AgentKey
                      - AgentCA
                      - PlatformJSON
                      - HWSKUJSON
                      - PortConfig
                      - SAIProfile
                      - BroadcomConfig
                      - PlatformWheel
                      - PlatformInit
                      - PlatformChassis
                      - PlatformSFP
                      - PlatformEEPROM
                      - PlatformPSU
                      - PlatformFan
                      - PlatformThermal
                      - PlatformAPI
                      - PlatformComponent
                      - PlatformFanDrawer
                      type: string
                  required:
                  - chunks
                  - sha256
                  - slot
                  type: object
                  x-kubernetes-validations:
                  - message: certificate slots require Secret references; software
                      slots require ConfigMap references
                    rule: 'self.slot in [''AgentKey'', ''AgentCertificate'', ''AgentCA'']
                      ? self.chunks.all(c, c.kind == ''Secret'') : self.chunks.all(c,
                      c.kind == ''ConfigMap'')'
                maxItems: 64
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - slot
                x-kubernetes-list-type: map
              managementPolicy:
                default: Observe
                enum:
                - Observe
                - Manage
                type: string
              retireLegacyHook:
                description: |-
                  Retire the existing legacy site hook only after full site content health and
                  protected persistence are proven by the confirming controller connection.
                type: boolean
              switchName:
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: switchName is immutable
                  rule: self == oldSelf
            required:
            - baseline
            - files
            - switchName
            type: object
            x-kubernetes-validations:
            - message: Manage requires a declared immutable bootstrap baseline
              rule: '!has(self.managementPolicy) || self.managementPolicy != ''Manage''
                || has(self.bootstrap)'
            - message: HostConfig requires a complete host baseline and HostGuard
              rule: '!has(self.agent) || !has(self.agent.hostConfig) || !self.agent.hostConfig
                || (has(self.bootstrap) && has(self.bootstrap.hostRecovery) && has(self.agent.hostGuard)
                && self.agent.hostGuard)'
            - message: host bootstrap requires retained HostGuard
              rule: '!has(self.bootstrap) || !has(self.bootstrap.hostRecovery) ||
                (has(self.agent) && has(self.agent.hostGuard) && self.agent.hostGuard)'
            - message: bootstrap baseline is immutable; supervisor and policy may
                only change with bootstrapMigrationFrom set to the replaced policySHA256,
                and hostRecovery and unitSHA256 unchanged
              rule: '!has(oldSelf.bootstrap) || (has(self.bootstrap) && (self.bootstrap
                == oldSelf.bootstrap || (has(self.bootstrapMigrationFrom) && self.bootstrapMigrationFrom
                == oldSelf.bootstrap.policySHA256 && self.bootstrap.unitSHA256 ==
                oldSelf.bootstrap.unitSHA256 && has(self.bootstrap.hostRecovery) ==
                has(oldSelf.bootstrap.hostRecovery) && (!has(self.bootstrap.hostRecovery)
                || self.bootstrap.hostRecovery == oldSelf.bootstrap.hostRecovery))))'
          status:
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              configurationVerified:
                type: boolean
              confirmedGeneration:
                description: |-
                  ConfirmedGeneration is the generation whose declaration the switch last
                  confirmed. A later generation with identical content (for example only a
                  managementPolicy change) is converged without staging again.
                format: int64
                type: integer
              identity:
                type: string
              observedGeneration:
                format: int64
                type: integer
              persistenceVerified:
                type: boolean
              recoveryPhase:
                type: string
              recoveryReason:
                type: string
              runtimeVerified:
                type: boolean
              target:
                description: Target binds UID, endpoint and credential reference across
                  retries.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
